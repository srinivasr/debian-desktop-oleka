# Same pipeline as .github/workflows/build.yml, for CircleCI (free plan works for private repos).
# Two jobs so a failed boot test can be re-run without rebuilding the ISO.
version: 2.1
jobs:
  build-iso:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Unit tests
          command: |
            pip install pytest
            python3 scripts/gen-theme.py
            python3 -m pytest -q tests launcher/tests
      - run:
          name: Build ISO in a Debian trixie container
          no_output_timeout: 60m
          command: |
            docker run --rm --privileged -v "$PWD":/w -w /w debian:trixie bash -c '
              apt-get update && apt-get install -y live-build git python3 make sudo ca-certificates xorriso squashfs-tools &&
              git config --global --add safe.directory /w &&
              sh scripts/build.sh'
      - run:
          name: Keep only the ISO files
          command: mkdir -p out && cp oleka-desktop.iso oleka-desktop.sha256 out/
      - persist_to_workspace:
          root: out
          paths: [oleka-desktop.iso, oleka-desktop.sha256]
      - store_artifacts:
          path: out/oleka-desktop.sha256
  boot-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install QEMU
          command: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run:
          name: QEMU boot test
          no_output_timeout: 30m
          command: sh scripts/qemu-test.sh oleka-desktop.iso
      - run:
          name: Save serial log
          when: always
          command: mkdir -p logs && cp qemu-serial.log logs/ || true
      - store_artifacts:
          path: logs
          destination: logs
  screenshots:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install QEMU and tools
          command: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso netcat-openbsd imagemagick
      - run:
          name: Boot and take desktop screenshots
          no_output_timeout: 30m
          command: sh scripts/qemu-screenshots.sh oleka-desktop.iso shots
      - store_artifacts:
          path: shots
          destination: shots
  repro-check:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: first
      - run:
          name: Rebuild the ISO from the same commit
          no_output_timeout: 60m
          command: |
            docker run --rm --privileged -v "$PWD":/w -w /w debian:trixie bash -c '
              apt-get update && apt-get install -y live-build git python3 make sudo ca-certificates xorriso squashfs-tools &&
              git config --global --add safe.directory /w &&
              sh scripts/build.sh'
      - run:
          name: Compare the two builds
          command: |
            mkdir -p cmp a b
            sha256sum first/oleka-desktop.iso oleka-desktop.iso | tee cmp/sums.txt
            xorriso -osirrox on -indev first/oleka-desktop.iso -extract /live a 2>/dev/null || true
            xorriso -osirrox on -indev oleka-desktop.iso -extract /live b 2>/dev/null || true
            (cd a/live && sha256sum * | sed 's|  | first/live/|') | tee -a cmp/sums.txt || true
            (cd b/live && sha256sum * | sed 's|  | second/live/|') | tee -a cmp/sums.txt || true
            if cmp -s first/oleka-desktop.iso oleka-desktop.iso; then echo IDENTICAL > cmp/result.txt; else echo DIFFERENT > cmp/result.txt; fi
            cat cmp/result.txt
            cmp -l first/oleka-desktop.iso oleka-desktop.iso | wc -l > cmp/differing-bytes.txt || true
            cat cmp/differing-bytes.txt
            cmp -l first/oleka-desktop.iso oleka-desktop.iso | awk 'NR==1{lo=$1} {hi=$1} END{print "first differing byte offset", lo, "last", hi}' | tee cmp/offsets.txt
            xorriso -indev first/oleka-desktop.iso -pvd_info 2>&1 | grep -iE "time|uuid|id" > cmp/pvd-first.txt || true
            xorriso -indev oleka-desktop.iso -pvd_info 2>&1 | grep -iE "time|uuid|id" > cmp/pvd-second.txt || true
            diff cmp/pvd-first.txt cmp/pvd-second.txt | tee cmp/pvd-diff.txt || true
      - store_artifacts:
          path: cmp
          destination: cmp
workflows:
  build:
    jobs:
      - build-iso
      - boot-test:
          requires: [build-iso]
      - screenshots:
          requires: [build-iso]
      - repro-check:
          requires: [build-iso]
